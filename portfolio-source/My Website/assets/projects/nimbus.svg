  <g>
    <rect x="700" y="322" width="150" height="40" rx="20" fill="#141a2e" stroke="#8b6bff" stroke-width="1.5"/>
    <text x="722" y="347" font-family="Inter, sans-serif" font-size="13" fill="#eef1f8">tighten tone ✦</text>
  </g>
  <!-- sparkle accents -->
  <g fill="#8b6bff">
    <path d="M905 200 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z"/>
    <path d="M300 560 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#4cf3ff"/>
  </g>
  <text x="60" y="670" font-family="JetBrains Mono, monospace" font-size="15" fill="#8b6bff" opacity="0.85">// suggestion.stream(mode: "inline")</text>
</svg>
