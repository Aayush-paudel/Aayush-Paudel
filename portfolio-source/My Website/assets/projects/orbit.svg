<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bgO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <radialGradient id="glowO" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#4cf3ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4cf3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineO" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cf3ff"/>
      <stop offset="1" stop-color="#8b6bff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgO)"/>
  <rect width="1200" height="750" fill="url(#glowO)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.045">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200 M0 600 H1200"/>
    <path d="M200 0 V750 M400 0 V750 M600 0 V750 M800 0 V750 M1000 0 V750"/>
  </g>
  <!-- orbit rings -->
  <g fill="none" stroke="url(#lineO)" stroke-width="1.4" opacity="0.7">
    <ellipse cx="600" cy="390" rx="330" ry="120" transform="rotate(-12 600 390)"/>
    <ellipse cx="600" cy="390" rx="260" ry="230" transform="rotate(18 600 390)" opacity="0.55"/>
    <ellipse cx="600" cy="390" rx="400" ry="90" transform="rotate(6 600 390)" opacity="0.4"/>
  </g>
  <!-- scattered data nodes forming a point-cloud cluster -->
  <g>
    <circle cx="600" cy="390" r="7" fill="#4cf3ff"/>
    <circle cx="540" cy="330" r="4" fill="#8b6bff"/>
    <circle cx="680" cy="350" r="5" fill="#4cf3ff"/>
    <circle cx="470" cy="410" r="3.5" fill="#ff4fb8"/>
    <circle cx="740" cy="430" r="4.5" fill="#8b6bff"/>
    <circle cx="610" cy="470" r="3" fill="#4cf3ff"/>
    <circle cx="500" cy="290" r="3" fill="#4cf3ff"/>
    <circle cx="800" cy="300" r="3.5" fill="#ff4fb8"/>
    <circle cx="430" cy="500" r="3" fill="#8b6bff"/>
    <circle cx="770" cy="500" r="4" fill="#4cf3ff"/>
    <circle cx="340" cy="360" r="2.5" fill="#8b6bff" opacity="0.8"/>
    <circle cx="880" cy="420" r="2.5" fill="#4cf3ff" opacity="0.8"/>
    <circle cx="600" cy="230" r="2.5" fill="#ff4fb8" opacity="0.8"/>
    <circle cx="600" cy="560" r="2.5" fill="#4cf3ff" opacity="0.8"/>
    <g stroke="#4cf3ff" stroke-opacity="0.35" stroke-width="1">
      <line x1="600" y1="390" x2="540" y2="330"/>
      <line x1="600" y1="390" x2="680" y2="350"/>
      <line x1="600" y1="390" x2="470" y2="410"/>
      <line x1="600" y1="390" x2="740" y2="430"/>
      <line x1="600" y1="390" x2="610" y2="470"/>
      <line x1="540" y1="330" x2="500" y2="290"/>
      <line x1="680" y1="350" x2="800" y2="300"/>
      <line x1="470" y1="410" x2="430" y2="500"/>
      <line x1="740" y1="430" x2="770" y2="500"/>
    </g>
  </g>
  <!-- crosshair / camera reticle -->
  <g stroke="#eef1f8" stroke-opacity="0.5" stroke-width="1">
    <circle cx="600" cy="390" r="180" fill="none" stroke-dasharray="2 8"/>
  </g>
  <text x="60" y="670" font-family="JetBrains Mono, monospace" font-size="15" fill="#4cf3ff" opacity="0.8">// point_cloud.render(dims: 3, points: 128k)</text>
</svg>
