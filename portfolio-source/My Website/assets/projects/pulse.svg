<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="1" stop-color="#181022"/>
    </linearGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#ff4fb8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff4fb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bandP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1e2c"/>
      <stop offset="1" stop-color="#0e1018"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgP)"/>
  <rect width="1200" height="750" fill="url(#glowP)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200 M0 600 H1200"/>
  </g>
  <!-- wrist band -->
  <path d="M120 375 C 280 250, 480 250, 600 375 C 480 500, 280 500, 120 375 Z" fill="none" stroke="#8b6bff" stroke-opacity="0.25" stroke-width="90"/>
  <path d="M1080 375 C 920 250, 720 250, 600 375 C 720 500, 920 500, 1080 375 Z" fill="none" stroke="#8b6bff" stroke-opacity="0.25" stroke-width="90"/>
  <!-- device housing -->
  <rect x="470" y="270" width="260" height="210" rx="42" fill="url(#bandP)" stroke="#2a2f42" stroke-width="2"/>
  <rect x="498" y="298" width="204" height="154" rx="24" fill="#05060a" stroke="#3a4058"/>
  <!-- heartbeat waveform on screen -->
  <polyline points="510,375 545,375 560,335 585,415 605,355 625,395 650,375 692,375"
    fill="none" stroke="#4cf3ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="605" cy="375" r="4" fill="#ff4fb8"/>
  <!-- small sensor dot -->
  <circle cx="600" cy="470" r="8" fill="#2a2f42" stroke="#4cf3ff" stroke-width="1.5"/>
  <text x="60" y="670" font-family="JetBrains Mono, monospace" font-size="15" fill="#ff4fb8" opacity="0.85">// ppg_signal.detect_fatigue_trend()</text>
</svg>
