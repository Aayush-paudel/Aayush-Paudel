<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="1" stop-color="#0f1a18"/>
    </linearGradient>
    <radialGradient id="glowS" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#4cf3ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4cf3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgS)"/>
  <rect width="1200" height="750" fill="url(#glowS)"/>
  <!-- floor grid (overhead view) -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 175 H1200 M0 300 H1200 M0 425 H1200 M0 550 H1200"/>
    <path d="M150 0 V750 M350 0 V750 M550 0 V750 M750 0 V750 M950 0 V750 M1150 0 V750"/>
  </g>
  <!-- mesh connections between robot units -->
  <g stroke="#4cf3ff" stroke-opacity="0.35" stroke-width="1.3">
    <line x1="330" y1="260" x2="560" y2="230"/>
    <line x1="560" y1="230" x2="820" y2="290"/>
    <line x1="330" y1="260" x2="420" y2="460"/>
    <line x1="420" y1="460" x2="700" y2="500"/>
    <line x1="700" y1="500" x2="820" y2="290"/>
    <line x1="700" y1="500" x2="900" y2="520"/>
    <line x1="820" y1="290" x2="900" y2="520"/>
  </g>
  <!-- robot units (hex nodes) -->
  <g>
    <!-- reusable hex via transform -->
    <g transform="translate(330,260)">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#141a2e" stroke="#4cf3ff" stroke-width="2"/>
      <circle r="6" fill="#4cf3ff"/>
    </g>
    <g transform="translate(560,230)">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#141a2e" stroke="#8b6bff" stroke-width="2"/>
      <circle r="6" fill="#8b6bff"/>
    </g>
    <g transform="translate(820,290)">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#141a2e" stroke="#4cf3ff" stroke-width="2"/>
      <circle r="6" fill="#4cf3ff"/>
    </g>
    <g transform="translate(420,460)">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#141a2e" stroke="#ff4fb8" stroke-width="2"/>
      <circle r="6" fill="#ff4fb8"/>
    </g>
    <g transform="translate(700,500)">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#141a2e" stroke="#4cf3ff" stroke-width="2"/>
      <circle r="6" fill="#4cf3ff"/>
    </g>
    <g transform="translate(900,520)">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#141a2e" stroke="#8b6bff" stroke-width="2"/>
      <circle r="6" fill="#8b6bff"/>
    </g>
  </g>
  <!-- planned path for one unit -->
  <path d="M330 260 Q 480 320 560 230 T 820 290" fill="none" stroke="#eef1f8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="60" y="670" font-family="JetBrains Mono, monospace" font-size="15" fill="#4cf3ff" opacity="0.85">// swarm.negotiate_path(units: 6, protocol: "decentralized")</text>
</svg>
